version: '3.8'

services:
  varynt-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./varynt_agent_trace.log:/app/varynt_agent_trace.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1